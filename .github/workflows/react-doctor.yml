name: React Doctor

on:
  push:
    branches: [main, dev, dev/**]
  pull_request:
    branches: [main, dev, dev/**]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scan:
    name: React Doctor Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run React Doctor
        id: react_doctor
        run: |
          OUTPUT=$(pnpm dlx react-doctor@0.0.37 . --verbose --score 2>&1 || true)
          SCORE=$(printf '%s' "$OUTPUT" | node -e "const fs=require('fs');const s=fs.readFileSync(0,'utf8');const m=[...s.matchAll(/Score:\s*(\d+)/g)];process.stdout.write(m.length?m[m.length-1][1]:'0');")
          if [ -z "$SCORE" ]; then
            SCORE=0
          fi

          SAFE_OUTPUT=$(printf '%s' "$OUTPUT" | node -e "const fs=require('fs');const s=fs.readFileSync(0,'utf8');const max=60000;process.stdout.write(s.length>max ? s.slice(0,max)+'\\n\\n[truncated for CI comment]' : s);")
          DELIM="RD_OUTPUT_$(date +%s)_$RANDOM"

          {
            echo "score=$SCORE"
            echo "output<<$DELIM"
            echo "$SAFE_OUTPUT"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### React Doctor Output"
            echo '```'
            echo "$SAFE_OUTPUT"
            echo '```'
            echo "**Score: $SCORE / 100**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REACT_DOCTOR_SCORE: ${{ steps.react_doctor.outputs.score }}
          REACT_DOCTOR_OUTPUT: ${{ steps.react_doctor.outputs.output }}
        with:
          script: |
            const score = Number.parseInt(process.env.REACT_DOCTOR_SCORE || '0', 10);
            const output = process.env.REACT_DOCTOR_OUTPUT || '';

            const label =
              score >= 75 ? '🟢 Great' :
              score >= 50 ? '🟡 Needs Work' :
                            '🔴 Critical';

            const body = [
              '## 🩺 React Doctor Report',
              '',
              `**Score: ${score}/100 — ${label}**`,
              '',
              '<details>',
              '<summary>View full diagnostics</summary>',
              '',
              '```',
              output,
              '```',
              '</details>',
              '',
              score < 50
                ? '> ⚠️ Score is critical. Please review the diagnostics above before merging.'
                : score < 75
                ? '> 💡 A few things to improve before merging.'
                : '> ✅ Looks healthy! Good to merge.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('🩺 React Doctor Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Create GitHub Issue for critical score
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.react_doctor.outputs.score < 50
        uses: actions/github-script@v7
        env:
          REACT_DOCTOR_SCORE: ${{ steps.react_doctor.outputs.score }}
          REACT_DOCTOR_OUTPUT: ${{ steps.react_doctor.outputs.output }}
        with:
          script: |
            const score = process.env.REACT_DOCTOR_SCORE || '0';
            const output = process.env.REACT_DOCTOR_OUTPUT || '';
            const sha = context.sha.substring(0, 7);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'react-doctor,bug',
              state: 'open',
            });

            const alreadyOpen = issues.some((i) => i.title.includes('React Doctor'));
            if (alreadyOpen) {
              console.log('Issue already open, skipping creation.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 React Doctor: Critical score (${score}/100) on \`${sha}\``,
              body: [
                '## React Doctor detected critical issues',
                '',
                `**Score:** ${score}/100  `,
                `**Commit:** [\`${sha}\`](${context.payload.head_commit?.url || '#'})  `,
                `**CI Run:** [View full run](${runUrl})`,
                '',
                '### Diagnostics',
                '',
                '```',
                output,
                '```',
                '',
                '### What to do',
                '- Review the diagnostics above',
                '- Fix errors (🔴) first — they impact the score most',
                '- Then address warnings (🟡)',
                '- Re-run `pnpm dlx react-doctor@0.0.37 . --verbose` locally to verify',
                '',
                '> This issue was automatically created by the React Doctor CI workflow.',
              ].join('\n'),
              labels: ['react-doctor', 'bug'],
              assignees: [],
            });
