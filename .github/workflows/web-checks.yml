name: Web checks

on:
  push:
    branches: [main, dev, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
